name: Generate RINON static preview

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/static-preview-main.yml"

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Prepare review-only static source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf app/api app/admin
          rm -f proxy.ts app/opengraph-image.tsx app/opengraph-image.ts app/opengraph-image.js
          python3 - <<'PY'
          from pathlib import Path
          for file, old, new in [
            ('components/QuoteForm.tsx','fetch("/api/contacto"','fetch("/functions/v1/rinon-preview/api/contacto"'),
            ('components/PrivacyRequestForm.tsx','fetch("/api/privacidad"','fetch("/functions/v1/rinon-preview/api/privacidad"'),
            ('components/ProductionTracking.tsx','fetch("/api/analytics"','fetch("/functions/v1/rinon-preview/api/analytics"'),
          ]:
            p=Path(file)
            if p.exists(): p.write_text(p.read_text().replace(old,new))
          PY
          cat > next.config.ts <<'EOF'
          import type { NextConfig } from "next";
          const nextConfig: NextConfig = {
            output: "export",
            trailingSlash: true,
            basePath: "/functions/v1/rinon-preview",
            assetPrefix: "/functions/v1/rinon-preview",
            images: { unoptimized: true },
            poweredByHeader: false,
            reactStrictMode: true,
          };
          export default nextConfig;
          EOF
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Export
        env:
          RINON_INDEXABLE: "false"
          RINON_ENABLE_MIGRATION_REDIRECTS: "false"
          RINON_ENABLE_BLOG_REDIRECTS: "false"
          RINON_ALLOW_LEGACY_REFERENCE_IMAGES: "false"
          RINON_POWDER_COATING_LAUNCH_ENABLED: "false"
          RINON_GRANALLADO_LAUNCH_ENABLED: "false"
          NEXT_PUBLIC_RINON_WHATSAPP_NUMBER: "56975893742"
          NEXT_PUBLIC_RINON_PHONE_DISPLAY: "+56 9 7589 3742"
          NEXT_PUBLIC_RINON_PUBLIC_ADDRESS: "Portezuelo 1506"
          NEXT_PUBLIC_RINON_PUBLIC_LOCALITY: "San Bernardo"
          NEXT_PUBLIC_RINON_LEGAL_ENTITY: "Tolipoli SpA"
          NEXT_PUBLIC_RINON_LEGAL_TAX_ID: "77.795.508-K"
        run: npm run build
      - name: Publish static-preview branch
        shell: bash
        run: |
          set -euo pipefail
          test -f out/index.html
          rm -rf /tmp/rinon-out
          cp -a out /tmp/rinon-out
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan static-preview-worktree
          git rm -rf .
          # Remove build/install leftovers before .gitignore disappears from the orphan tree.
          git clean -fdx
          cp -a /tmp/rinon-out/. .
          touch .nojekyll
          git add -A
          git commit -m "Static RINON preview from ${GITHUB_SHA}"
          git push origin HEAD:static-preview --force
      - name: Verify external Supabase preview
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://wbinwroidinsretcgsox.supabase.co/functions/v1/rinon-preview"
          check_json() {
            local url="$1"
            echo "Checking $url"
            curl --fail --silent --show-error --location \
              --retry 8 --retry-all-errors --retry-delay 2 \
              "$url" | grep -q '"ok":true'
          }
          check_html() {
            local url="$1"
            local tmp
            tmp="$(mktemp)"
            echo "Checking $url"
            curl --fail --silent --show-error --location \
              --retry 8 --retry-all-errors --retry-delay 2 \
              "$url" -o "$tmp"
            grep -qi '<html' "$tmp"
            grep -qi 'RINON' "$tmp"
            rm -f "$tmp"
          }
          check_json "$BASE/__health"
          check_html "$BASE/"
          check_html "$BASE/camarotes/"
          check_html "$BASE/cotizar/"
