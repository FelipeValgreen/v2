name: RINON Public Intake QA

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/qa-public-intake.yml"

jobs:
  intake:
    runs-on: ubuntu-latest
    steps:
      - name: Lead intake returns 201
        shell: bash
        run: |
          set -euo pipefail
          endpoint="https://wbinwroidinsretcgsox.supabase.co/functions/v1/rinon-public-intake"
          code=$(curl -sS -o /tmp/lead.out -w "%{http_code}" -X POST "$endpoint" \
            -H 'content-type: application/json' \
            -H 'x-rinon-client-ip: 203.0.113.10' \
            --data '{"kind":"lead","data":{"nombre":"QA RINON","telefono":"+56911111111","email":"qa-rinon@example.invalid","comuna":"Santiago","servicio":"QA automatizado","mensaje":"__RINON_QA_LEAD__","contacto_preferido":"WhatsApp","pagina_origen":"/qa"}}')
          cat /tmp/lead.out
          test "$code" = "201"

      - name: Privacy intake returns 201
        shell: bash
        run: |
          set -euo pipefail
          endpoint="https://wbinwroidinsretcgsox.supabase.co/functions/v1/rinon-public-intake"
          code=$(curl -sS -o /tmp/privacy.out -w "%{http_code}" -X POST "$endpoint" \
            -H 'content-type: application/json' \
            -H 'x-rinon-client-ip: 203.0.113.11' \
            --data '{"kind":"privacy","data":{"request_type":"access","nombre":"QA RINON","email":"qa-privacy@example.invalid","telefono":"+56911111112","details":"__RINON_QA_PRIVACY__ solicitud automatizada de prueba","source_path":"/qa"}}')
          cat /tmp/privacy.out
          test "$code" = "201"

      - name: Analytics intake returns 204
        shell: bash
        run: |
          set -euo pipefail
          endpoint="https://wbinwroidinsretcgsox.supabase.co/functions/v1/rinon-public-intake"
          code=$(curl -sS -o /tmp/analytics.out -w "%{http_code}" -X POST "$endpoint" \
            -H 'content-type: application/json' \
            -H 'x-rinon-client-ip: 203.0.113.12' \
            --data '{"kind":"analytics","data":{"event_name":"page_view","page_path":"/__rinon_qa__","page_title":"RINON QA","referrer_host":"qa.invalid","visitor_id":"rinonqa01","session_id":"rinonqa02"}}')
          cat /tmp/analytics.out
          test "$code" = "204"
