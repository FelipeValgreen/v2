name: Reconstruct RINON V5.6 final visual assets

on:
  push:
    branches: [release/v5-6-complete]
    paths:
      - ".asset-chunks/READY"

permissions:
  contents: write

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct and verify visual assets
        shell: bash
        run: |
          set -euo pipefail
          make_asset() {
            name="$1"
            dest="$2"
            expected="$3"
            mkdir -p "$(dirname "$dest")"
            cat ".asset-chunks/$name/"*.b64 | base64 -d > "$dest"
            echo "$expected  $dest" | sha256sum -c -
          }
          make_asset "home-hero-conceptual-welding.webp" "public/visuals/home-hero-conceptual-welding.webp" "58433b1c12782d0f683407022b6db3879a688a590497f65e4a9b32f52f8d33c8"
          make_asset "camarote-conceptual.webp" "public/visuals/product-theatre/camarote-conceptual.webp" "9942ef3cb9b863fc3aebf2b0ad3face8f4fac86f161d588cb6f97e19ceaf35d6"
          make_asset "cierre-conceptual.webp" "public/visuals/product-theatre/cierre-conceptual.webp" "ff4442f43e235c88d78c2234f8c5c5484e8df1cf499e11f82370bfc781c2d58a"
          make_asset "estructura-conceptual.webp" "public/visuals/product-theatre/estructura-conceptual.webp" "7d948f4abe4aca756f2bcde68479435b7738fc03099fd9435c771b28f786cc4c"
          rm -rf .asset-chunks
          rm -f .github/workflows/reconstruct-assets.yml
      - name: Commit verified assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/visuals .asset-chunks .github/workflows/reconstruct-assets.yml
          git commit -m "assets: finalize verified RINON V5.6 visuals"
          git push origin HEAD:${GITHUB_REF_NAME}
